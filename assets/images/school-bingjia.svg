<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <filter id="bing-ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="3" seed="37" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="bing-moon" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.02"/>
      <stop offset="76%" stop-color="#1a1a1a" stop-opacity="0.075"/>
      <stop offset="96%" stop-color="#1a1a1a" stop-opacity="0.115"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain-bg" x1="60" y1="150" x2="340" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c2c2c" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#1f1f1f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2a2a2a" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- 淡墨圆月 -->
  <circle cx="200" cy="176" r="134" fill="url(#bing-moon)"/>

  <!-- 远景险峻山川兵势 -->
  <g filter="url(#bing-ink)">
    <path d="M 48 232 L 108 164 L 154 202 L 214 142 L 266 198 L 314 166 L 358 232 Z" fill="url(#mountain-bg)"/>
    <path d="M 108 164 L 122 198 M 214 142 L 204 196 M 314 166 L 304 204" stroke="#222222" stroke-width="1.2" stroke-opacity="0.35"/>
  </g>

  <!-- 苍石、入鞘古剑与围棋局 -->
  <g filter="url(#bing-ink)">
    <!-- 苍石（稳重厚实） -->
    <path d="M 86 296 C 84 260, 114 232, 148 236 C 174 239, 190 264, 198 296 Z" fill="#2b2b2b" fill-opacity="0.72"/>
    <path d="M 114 244 C 130 256, 134 274, 130 292" stroke="#161616" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- 入鞘古剑斜倚苍石 -->
    <g transform="rotate(33 176 206)">
      <!-- 剑鞘 -->
      <path d="M 169 138 L 183 138 L 180 330 L 176 340 L 172 330 Z" fill="#181818"/>
      <line x1="176" y1="145" x2="176" y2="322" stroke="#5a5a5a" stroke-width="1" stroke-opacity="0.45"/>
      <!-- 剑格（护手） -->
      <path d="M 155 138 L 197 138 L 192 146 L 160 146 Z" fill="#121212"/>
      <!-- 剑柄与剑首 -->
      <rect x="172" y="96" width="8" height="42" rx="1.5" fill="#2a2a2a"/>
      <ellipse cx="176" cy="94" rx="7" ry="4" fill="#151515"/>
      <!-- 剑穗飘垂 -->
      <path d="M 176 92 C 188 106, 194 128, 188 152" stroke="#282828" stroke-width="1.4" stroke-opacity="0.75" fill="none"/>
    </g>

    <!-- 棋盘透视一隅与散落黑白弈子（庙算胜意象） -->
    <path d="M 174 304 L 308 286 L 348 326 L 210 348 Z" fill="#e5dfd2" fill-opacity="0.55" stroke="#242424" stroke-width="1.6"/>
    <!-- 棋盘经纬格线 -->
    <g stroke="#2a2a2a" stroke-width="0.95" stroke-opacity="0.65">
      <line x1="201" y1="300" x2="237" y2="343"/>
      <line x1="228" y1="296" x2="265" y2="339"/>
      <line x1="255" y1="293" x2="293" y2="335"/>
      <line x1="282" y1="289" x2="321" y2="331"/>
      <line x1="184" y1="315" x2="318" y2="296"/>
      <line x1="194" y1="326" x2="328" y2="306"/>
      <line x1="203" y1="337" x2="338" y2="316"/>
    </g>
    <!-- 散落黑白棋子 -->
    <ellipse cx="222" cy="316" rx="7" ry="4.5" fill="#151515"/>
    <ellipse cx="268" cy="306" rx="7" ry="4.5" fill="#151515"/>
    <ellipse cx="294" cy="322" rx="7" ry="4.5" fill="#151515"/>
    <ellipse cx="246" cy="308" rx="6.8" ry="4.3" fill="#f7f4ed" stroke="#1e1e1e" stroke-width="1.3"/>
    <ellipse cx="256" cy="329" rx="6.8" ry="4.3" fill="#f7f4ed" stroke="#1e1e1e" stroke-width="1.3"/>
    <ellipse cx="298" cy="300" rx="6.8" ry="4.3" fill="#f7f4ed" stroke="#1e1e1e" stroke-width="1.3"/>
  </g>
</svg>
