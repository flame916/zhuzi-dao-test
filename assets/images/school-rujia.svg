<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <filter id="ink-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="moon-wash" cx="48%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.03"/>
      <stop offset="72%" stop-color="#1a1a1a" stop-opacity="0.075"/>
      <stop offset="94%" stop-color="#1a1a1a" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pine-trunk" x1="360" y1="70" x2="180" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="55%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#3c3c3c" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="scroll-shade" x1="80" y1="270" x2="290" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222222" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2e2e2e" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- 淡墨圆月晕底 -->
  <circle cx="192" cy="176" r="136" fill="url(#moon-wash)"/>

  <!-- 苍劲古松枝干与层叠松针 -->
  <g filter="url(#ink-soft)">
    <!-- 主松枝斜出 -->
    <path d="M 372 78 C 330 98, 294 114, 258 138 C 228 158, 198 150, 166 168 C 148 178, 134 190, 118 198 C 138 188, 158 176, 178 168 C 208 156, 238 165, 270 144 C 304 122, 340 109, 376 94 Z" fill="url(#pine-trunk)"/>
    <!-- 分枝 -->
    <path d="M 278 132 C 266 112, 245 96, 218 88 C 242 98, 258 114, 268 136 Z" fill="#222222"/>
    <path d="M 222 156 C 216 135, 196 122, 168 118 C 192 126, 206 138, 213 158 Z" fill="#262626"/>
    <path d="M 314 118 C 325 142, 344 156, 368 166 C 344 152, 330 138, 323 114 Z" fill="#1e1e1e"/>

    <!-- 松针团簇（宋画扇形放射针法） -->
    <g stroke="#1b1b1b" stroke-linecap="round">
      <!-- 左下低枝针簇 -->
      <path d="M 118 197 L 84 185 M 118 197 L 90 175 M 118 197 L 103 168 M 118 197 L 118 166 M 118 197 L 134 170 M 118 197 L 145 182" stroke-width="1.5" stroke-opacity="0.82"/>
      <!-- 中枝针簇 -->
      <path d="M 168 118 L 136 108 M 168 118 L 144 96 M 168 118 L 158 88 M 168 118 L 174 86 M 168 118 L 190 92 M 168 118 L 200 104" stroke-width="1.6" stroke-opacity="0.85"/>
      <path d="M 184 124 L 156 120 M 184 124 L 166 105 M 184 124 L 182 99 M 184 124 L 198 103 M 184 124 L 210 115" stroke-width="1.4" stroke-opacity="0.65"/>
      <!-- 高枝主针簇 -->
      <path d="M 218 88 L 186 78 M 218 88 L 194 64 M 218 88 L 210 56 M 218 88 L 226 55 M 218 88 L 244 62 M 218 88 L 254 74" stroke-width="1.6" stroke-opacity="0.88"/>
      <path d="M 244 102 L 218 98 M 244 102 L 228 82 M 244 102 L 246 76 M 244 102 L 264 82 M 244 102 L 274 96" stroke-width="1.4" stroke-opacity="0.7"/>
      <!-- 右侧苍松针簇 -->
      <path d="M 294 114 L 266 96 M 294 114 L 278 82 M 294 114 L 296 76 M 294 114 L 314 82 M 294 114 L 328 96" stroke-width="1.6" stroke-opacity="0.8"/>
      <path d="M 358 162 L 330 156 M 358 162 L 340 140 M 358 162 L 358 134 M 358 162 L 375 142 M 358 162 L 386 154" stroke-width="1.5" stroke-opacity="0.72"/>
    </g>
    <!-- 淡墨烘染松团水气 -->
    <ellipse cx="168" cy="108" rx="34" ry="15" fill="#1a1a1a" fill-opacity="0.08"/>
    <ellipse cx="222" cy="78" rx="38" ry="16" fill="#1a1a1a" fill-opacity="0.09"/>
    <ellipse cx="116" cy="186" rx="28" ry="13" fill="#1a1a1a" fill-opacity="0.07"/>
  </g>

  <!-- 案头展开竹简书卷（水墨工笔与写意结合） -->
  <g filter="url(#ink-soft)">
    <!-- 投影淡墨 -->
    <ellipse cx="186" cy="332" rx="112" ry="11" fill="#1a1a1a" fill-opacity="0.1"/>
    <!-- 左侧收卷圆筒 -->
    <path d="M 86 266 C 78 266, 75 318, 86 322 C 94 324, 98 268, 86 266 Z" fill="#2c2c2c" fill-opacity="0.86"/>
    <ellipse cx="88" cy="294" rx="5.5" ry="27" fill="#444444" fill-opacity="0.35" stroke="#1a1a1a" stroke-width="1.4"/>
    <!-- 摊开的竹简片序列（透视微弧展开） -->
    <path d="M 94 270 C 145 276, 215 278, 272 269 L 274 320 C 216 328, 146 326, 94 320 Z" fill="#1a1a1a" fill-opacity="0.06" stroke="url(#scroll-shade)" stroke-width="1.6"/>
    <!-- 纵向竹简分片缝隙 -->
    <g stroke="#262626" stroke-width="1.15" stroke-opacity="0.72">
      <line x1="112" y1="271" x2="112" y2="322"/>
      <line x1="130" y1="273" x2="130" y2="323"/>
      <line x1="148" y1="274" x2="148" y2="324"/>
      <line x1="166" y1="274" x2="166" y2="325"/>
      <line x1="184" y1="274" x2="184" y2="325"/>
      <line x1="202" y1="274" x2="202" y2="325"/>
      <line x1="220" y1="273" x2="220" y2="324"/>
      <line x1="238" y1="272" x2="238" y2="323"/>
      <line x1="256" y1="271" x2="256" y2="321"/>
    </g>
    <!-- 上下两道编绳（韦编三绝意象） -->
    <path d="M 94 282 C 150 287, 214 288, 272 281" stroke="#1a1a1a" stroke-width="1.9" stroke-opacity="0.88" stroke-dasharray="8 3"/>
    <path d="M 94 310 C 150 315, 214 316, 272 309" stroke="#1a1a1a" stroke-width="1.9" stroke-opacity="0.88" stroke-dasharray="8 3"/>
    <!-- 右侧余卷卷轴 -->
    <path d="M 272 269 C 282 269, 286 320, 274 320" stroke="#1a1a1a" stroke-width="1.8" fill="#282828" fill-opacity="0.25"/>
    <ellipse cx="282" cy="295" rx="8" ry="26" fill="#242424" fill-opacity="0.78"/>
    <ellipse cx="282" cy="295" rx="3.2" ry="12" fill="#e8e4da" fill-opacity="0.5"/>
  </g>
</svg>
