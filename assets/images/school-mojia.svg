<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <filter id="mo-ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="3" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="mo-moon" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.02"/>
      <stop offset="76%" stop-color="#1a1a1a" stop-opacity="0.07"/>
      <stop offset="96%" stop-color="#1a1a1a" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222222" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#3a3a3a" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 淡墨圆月晕底 -->
  <circle cx="200" cy="184" r="134" fill="url(#mo-moon)"/>

  <!-- 高足古豆灯与极淡单色微光晕 -->
  <g filter="url(#mo-ink)">
    <circle cx="268" cy="144" r="56" fill="url(#lamp-glow)"/>
    <!-- 灯盏阴影 -->
    <ellipse cx="268" cy="272" rx="34" ry="6" fill="#1a1a1a" fill-opacity="0.1"/>
    <!-- 高足古灯座 -->
    <path d="M 246 270 L 290 270 L 281 258 L 255 258 Z" fill="#1f1f1f"/>
    <path d="M 264 258 L 265 186 L 271 186 L 272 258 Z" fill="#242424"/>
    <!-- 灯盘 -->
    <path d="M 238 174 C 246 190, 290 190, 298 174 Z" fill="#1b1b1b"/>
    <ellipse cx="268" cy="174" rx="30" ry="5" fill="#3a3a3a" fill-opacity="0.35" stroke="#1b1b1b" stroke-width="1.4"/>
    <!-- 微明灯火（纯水墨淡灰表现静谧暖感） -->
    <path d="M 268 171 C 261 159, 263 147, 268 136 C 274 147, 275 159, 268 171 Z" fill="#1e1e1e" fill-opacity="0.72"/>
    <path d="M 268 168 C 265 160, 266 153, 268 147 C 271 153, 271 160, 268 168 Z" fill="#f5f2eb" fill-opacity="0.82"/>
  </g>

  <!-- 古木作曲尺（矩）与墨斗（匠心兼爱意象） -->
  <g filter="url(#mo-ink)">
    <ellipse cx="164" cy="328" rx="92" ry="9" fill="#1a1a1a" fill-opacity="0.1"/>

    <!-- 鲁班木工曲尺（矩） -->
    <path d="M 88 158 L 106 158 L 106 286 L 222 286 L 222 302 L 88 302 Z" fill="#222222" fill-opacity="0.9"/>
    <g stroke="#f5f2eb" stroke-width="1.1" stroke-opacity="0.65">
      <line x1="106" y1="180" x2="99" y2="180"/>
      <line x1="106" y1="202" x2="99" y2="202"/>
      <line x1="106" y1="224" x2="99" y2="224"/>
      <line x1="106" y1="246" x2="99" y2="246"/>
      <line x1="106" y1="268" x2="99" y2="268"/>
      <line x1="130" y1="286" x2="130" y2="294"/>
      <line x1="154" y1="286" x2="154" y2="294"/>
      <line x1="178" y1="286" x2="178" y2="294"/>
      <line x1="202" y1="286" x2="202" y2="294"/>
    </g>

    <!-- 古墨斗与墨绳 -->
    <path d="M 142 230 C 142 215, 198 215, 206 230 L 210 256 L 146 256 Z" fill="#1b1b1b" fill-opacity="0.88"/>
    <circle cx="164" cy="234" r="11" fill="#3a3a3a" stroke="#161616" stroke-width="2"/>
    <circle cx="164" cy="234" r="4" fill="#e8e4da" fill-opacity="0.65"/>
    <!-- 墨池凹槽与木柄 -->
    <ellipse cx="192" cy="232" rx="9" ry="5" fill="#111111"/>
    <path d="M 130 248 L 146 244 L 146 253 L 130 256 Z" fill="#2c2c2c"/>
    <!-- 绷直墨线延伸 -->
    <line x1="204" y1="234" x2="296" y2="306" stroke="#1a1a1a" stroke-width="1.3" stroke-opacity="0.72" stroke-dasharray="14 3"/>
    <circle cx="296" cy="306" r="3" fill="#1a1a1a" fill-opacity="0.8"/>
  </g>
</svg>
