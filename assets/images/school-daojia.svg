<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <filter id="ink-cloud" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="dao-moon" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.025"/>
      <stop offset="76%" stop-color="#1a1a1a" stop-opacity="0.07"/>
      <stop offset="96%" stop-color="#1a1a1a" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far-hill" x1="40" y1="220" x2="340" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#333333" stop-opacity="0.02"/>
      <stop offset="35%" stop-color="#2a2a2a" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#1f1f1f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#333333" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- 空灵淡墨圆环月晕 -->
  <circle cx="200" cy="170" r="134" fill="url(#dao-moon)"/>

  <!-- 淡墨远山与烟云（大片留白） -->
  <g filter="url(#ink-cloud)">
    <path d="M 36 250 C 86 234, 128 212, 168 225 C 206 238, 250 208, 294 222 C 325 232, 350 242, 370 248 L 370 256 L 36 256 Z" fill="url(#far-hill)"/>
    <!-- 缭绕墨云 -->
    <path d="M 68 148 C 102 138, 134 143, 166 135 C 188 129, 212 135, 224 139" stroke="#2f2f2f" stroke-width="4" stroke-opacity="0.11" stroke-linecap="round"/>
    <path d="M 218 118 C 254 110, 294 115, 326 108" stroke="#242424" stroke-width="5" stroke-opacity="0.09" stroke-linecap="round"/>
  </g>

  <!-- 远空双仙鹤（简笔写意） -->
  <g stroke="#1b1b1b" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 主仙鹤 -->
    <path d="M 232 104 C 245 92, 260 92, 272 100" stroke-width="2" stroke-opacity="0.88"/>
    <path d="M 272 100 C 284 87, 300 84, 314 91" stroke-width="1.9" stroke-opacity="0.85"/>
    <path d="M 272 100 C 276 105, 282 108, 290 107" stroke-width="1.8" stroke-opacity="0.8"/>
    <path d="M 267 101 L 254 109" stroke-width="1.4" stroke-opacity="0.68"/>
    <!-- 伴飞远鹤 -->
    <path d="M 192 128 C 201 120, 212 120, 220 126 C 228 118, 238 116, 248 121" stroke-width="1.5" stroke-opacity="0.64"/>
  </g>

  <!-- 江面一叶扁舟与轻波 -->
  <g filter="url(#ink-cloud)">
    <!-- 船身 -->
    <path d="M 118 294 C 146 306, 214 307, 248 292 C 232 301, 164 302, 118 294 Z" fill="#1a1a1a"/>
    <path d="M 134 294 C 154 298, 206 298, 234 293" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 船篷 -->
    <path d="M 176 295 C 176 281, 185 276, 198 276 C 209 276, 216 282, 217 294 Z" fill="#272727" fill-opacity="0.85"/>
    <!-- 蓑笠隐士剪影 -->
    <path d="M 155 295 L 158 282 L 164 295 Z" fill="#1e1e1e"/>
    <path d="M 149 283 C 154 277, 162 277, 167 283 Z" fill="#171717"/>
    <!-- 长篙划水 -->
    <line x1="158" y1="286" x2="128" y2="310" stroke="#1a1a1a" stroke-width="1.5" stroke-opacity="0.85"/>
    <!-- 极简水波涟漪 -->
    <path d="M 92 313 C 138 310, 178 313, 214 311 C 242 309, 272 312, 304 310" stroke="#2c2c2c" stroke-width="1.2" stroke-opacity="0.34" stroke-linecap="round"/>
    <path d="M 124 323 C 166 320, 218 322, 268 320" stroke="#3a3a3a" stroke-width="1" stroke-opacity="0.22" stroke-linecap="round"/>
  </g>
</svg>
